name: Release

# Uploads the package to PyPI and pushes the Docker images when a GitHub Release is published. tag-release.yml creates the
# Release as a draft on the tag of a merged version bump, and publishing that draft by hand starts this workflow.
# A Release whose tag is not X.Y.Z, or whose tag names a commit with another version in pyproject.toml, fails the check
# job and publishes nothing.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag is the version in pyproject.toml
        shell: bash
        run: |
          set -euo pipefail
          rules=.github/scripts/release_version.py
          if ! python3 "${rules}" check "${GITHUB_REF_NAME}"; then
            echo "::error::refusing to publish tag ${GITHUB_REF_NAME}"
            exit 1
          fi
          if ! version=$(python3 "${rules}" read < pyproject.toml); then
            echo "::error::could not read the version from pyproject.toml at ${GITHUB_REF_NAME}"
            exit 1
          fi
          if [[ "${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} names a commit whose pyproject.toml holds version $(printf '%s' "${version}" | tr '\n' ' ')"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} is the version in pyproject.toml"

  pypi:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Poetry and build
        run: |
          pip install poetry
          poetry build
        timeout-minutes: 5
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        timeout-minutes: 5

  docker:
    runs-on: ubuntu-latest
    needs: pypi
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            semnil/tfdiagrams
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        timeout-minutes: 5
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TFDIAGRAMS_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        timeout-minutes: 20
