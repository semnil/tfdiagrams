name: Release

# Uploads the package to PyPI and pushes the Docker images when a GitHub Release is published. tag-release.yml creates the
# Release as a draft on the tag of a merged version bump, and publishing that draft by hand starts this workflow.
# A Release whose tag is not X.Y.Z, or whose tag names a commit with another version in pyproject.toml, fails the check
# job and publishes nothing.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check that the tag is the version in pyproject.toml
        shell: bash
        run: |
          set -euo pipefail
          rules=.github/scripts/release_version.py
          if ! python3 "${rules}" check "${GITHUB_REF_NAME}"; then
            echo "::error::refusing to publish tag ${GITHUB_REF_NAME}"
            exit 1
          fi
          if ! version=$(python3 "${rules}" read < pyproject.toml); then
            echo "::error::could not read the version from pyproject.toml at ${GITHUB_REF_NAME}"
            exit 1
          fi
          if [[ "${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} names a commit whose pyproject.toml holds version $(printf '%s' "${version}" | tr '\n' ' ')"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} is the version in pyproject.toml"

  pypi:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Poetry and build
        run: |
          pip install poetry
          poetry build
        timeout-minutes: 5
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        timeout-minutes: 5

  docker:
    runs-on: ubuntu-latest
    needs: pypi
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            semnil/tfdiagrams
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TFDIAGRAMS_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        timeout-minutes: 20
