name: 'Example'

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  example:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Build container
        run: docker build -t tfdiagrams-local .
      - name: Git config
        run: |
          git config --global user.name "github actions"
          git config --global user.email "1051877+semnil@users.noreply.github.com"

      - name: Generate graph
        run: |
          docker run --rm -v "${{ github.workspace }}:/app" -w /app tfdiagrams-local \
            sh -c "cd example/count && terraform init && terraform graph | tfdot -ograph.png"
          git add -A
          git diff --cached --exit-code --quiet || echo "update=true" >> "$GITHUB_OUTPUT"
        id: graph_status
      - name: Commit files
        if: ${{ steps.graph_status.outputs.update == 'true' }}
        run: |
          git commit -m "Update graph by tfdiagrams" && echo "commit=true" >> "$GITHUB_OUTPUT"
        id: git_commit
      - name: Push changes
        if: ${{ steps.git_commit.outputs.commit == 'true' }}
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # v1.3.0
        with:
          branch: ${{ github.head_ref }}
          github_token: ${{ steps.app-token.outputs.token }}
