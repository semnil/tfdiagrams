name: 'Example'

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  example:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # A run Dependabot triggers gets no Actions secrets: it checks out with GITHUB_TOKEN,
      # builds and generates the graph, and skips the commit and the push.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: github.actor != 'dependabot[bot]'
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build the wheel from this checkout
        run: |
          pip install poetry
          poetry build -f wheel
        timeout-minutes: 5
      - name: Build container
        run: docker build --target source -t tfdiagrams-local .
        timeout-minutes: 10
      - name: Git config
        run: |
          git config --global user.name "github actions"
          git config --global user.email "1051877+semnil@users.noreply.github.com"

      - name: Generate graph
        run: |
          docker run --rm -v "${{ github.workspace }}:/app" -w /app tfdiagrams-local \
            sh -c "cd example/count && terraform init && terraform graph | tfdot -ograph.png"
          git add -A
          git diff --cached --exit-code --quiet || echo "update=true" >> "$GITHUB_OUTPUT"
        id: graph_status
        timeout-minutes: 10
      - name: Commit files
        if: ${{ steps.graph_status.outputs.update == 'true' && github.actor != 'dependabot[bot]' }}
        run: |
          git commit -m "Update graph by tfdiagrams" && echo "commit=true" >> "$GITHUB_OUTPUT"
        id: git_commit
      - name: Push changes
        if: ${{ steps.git_commit.outputs.commit == 'true' }}
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # v1.3.0
        with:
          branch: ${{ github.head_ref }}
          github_token: ${{ steps.app-token.outputs.token }}
