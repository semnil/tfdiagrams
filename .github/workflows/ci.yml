name: CI

# Runs the tests and builds the package on every pull request and every push to master.
# tag-release.yml starts when this workflow completes on a push to master, and tags only a commit this workflow passed.
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pip install poetry
        timeout-minutes: 5
      - name: Install dependencies
        run: poetry install --no-interaction
        timeout-minutes: 5
      - name: Run tests
        run: poetry run pytest -q
      - name: Build
        run: poetry build

  release-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the release workflow tests
        run: bash .github/tests/release-test.sh
