name: CI

# Runs the tests and builds the package on every pull request and every push to master.
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pip install poetry
        timeout-minutes: 5
      - name: Install dependencies
        run: poetry install --no-interaction
        timeout-minutes: 5
      - name: Run tests
        run: poetry run pytest -q
      - name: Build
        run: poetry build
