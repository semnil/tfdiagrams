name: Workflow checks

# Runs on every pull request with this file as it is on the default branch (pull_request_target),
# so a pull request cannot change the check that judges it. The pull request's workflow and action files are
# fetched as data through the GitHub API at the head commit and parsed with yq; nothing from the pull request
# is checked out or executed, and the token is read-only.
# Every jobs.<id>.uses / jobs.<id>.steps[*].uses in .github/workflows/ and runs.steps[*].uses in action.yml /
# action.yaml must be a 40-character commit SHA with a # vX.Y.Z comment on the same line (local ./ references
# are exempt).
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  action-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: exit 0
