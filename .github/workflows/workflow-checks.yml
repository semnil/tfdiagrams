name: Workflow checks

# Runs on every pull request: every jobs.<id>.uses and jobs.<id>.steps[*].uses in .github/workflows/ must be a 40-character commit SHA with a # vX.Y.Z comment on the same line (local ./ references are exempt)
on:
  pull_request:

permissions:
  contents: read

jobs:
  action-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check that every uses is pinned to a commit SHA
        shell: bash
        run: |
          shopt -s nullglob
          files=(.github/workflows/*.yml .github/workflows/*.yaml)
          uses='(.jobs[] | select(has("uses")) | .uses), (.jobs[].steps[]? | select(has("uses")) | .uses)'
          unpinned='('"$uses"') | select((test("^[.]/") | not) and ((test("^[^@[:space:]]+@[0-9a-f]{40}$") and (line_comment | test("^v[0-9]+[.][0-9]+[.][0-9]+$"))) | not)) | filename + ":" + (line | tostring) + ": " + . + "  # " + line_comment'
          yq --version
          total=0
          : > "$RUNNER_TEMP/unpinned.txt"
          for f in "${files[@]}"; do
            n=$(yq "[${uses}] | length" "$f")
            total=$((total + n))
            yq "$unpinned" "$f" >> "$RUNNER_TEMP/unpinned.txt"
          done
          echo "Checked ${total} uses entries in ${#files[@]} files"
          if [ "$total" -eq 0 ]; then
            echo "::error::No uses entries found under .github/workflows"
            exit 1
          fi
          if [ -s "$RUNNER_TEMP/unpinned.txt" ]; then
            echo "::error::uses must be @<40-char commit SHA> with a # vX.Y.Z comment on the same line"
            cat "$RUNNER_TEMP/unpinned.txt"
            exit 1
          fi
